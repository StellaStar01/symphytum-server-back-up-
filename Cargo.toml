cargo-features = ["codegen-backend"]

[workspace]
members = ["server","types"]
resolver = "3"

[workspace.dependencies]
prost = "0.14.4"
prost-protovalidate = { version = "0.6.0", features = ["tonic"] }
prost-types = "0.14.4"
tonic = "0.14.6"
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
prost-protovalidate-build = "0.6.0"
tokio = { version = "1.53.1", features = ["rt", "macros", "net", "time"] }
types = { path = "./types" }

[profile.release]
opt-level = 3
strip = true
lto = true
codegen-units = 1
panic = "abort"

[profile.release.build-override]
opt-level = 3
strip = true
codegen-units = 1

[profile.dev]
codegen-backend = "cranelift"
