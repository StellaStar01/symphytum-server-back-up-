cargo-features = ["codegen-backend"]

[workspace]
members = ["server","types"]
resolver = "3"

[workspace.dependencies]
aes = "0.9.1"
bytes = "1.12.1"
cbc = "0.2.1"
flate2 = "1.1.9"
http = "1.4.2"
http-body-util = "0.1.4"
md-5 = "0.11.0"
prost = "0.14.4"
prost-protovalidate = { version = "0.6.0", features = ["tonic"] }
prost-protovalidate-build = "0.6.0"
prost-types = "0.14.4"
rand = "0.10.2"
tokio = { version = "1.53.1", features = ["rt", "macros", "net", "time"] }
tonic = "0.14.6"
tonic-middleware = "0.4.1"
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tower = "0.5.3"
futures-util = "0.3.32"

# local
types = { path = "./types" }

[profile.release]
opt-level = 3
strip = true
lto = true
codegen-units = 1
panic = "abort"

[profile.release.build-override]
opt-level = 3
strip = true
codegen-units = 1

[profile.dev]
codegen-backend = "cranelift"
