cargo-features = ["codegen-backend"]

[workspace]
members = ["resource","server","types"]
resolver = "3"

[workspace.dependencies]
prost = "0.14.4"
prost-protovalidate = { version = "0.6.0", features = ["tonic"] }
prost-protovalidate-build = "0.6.0"
prost-types = "0.14.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt", "macros", "net", "time"] }
tonic = { version = "0.14.6", features = ["tls-ring"] }
tonic-debug = "0.3.0"
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# local
resource = { path = "./resource" }
types = { path = "./types" }

[profile.release]
codegen-backend = "llvm"
opt-level = 3
strip = true
lto = true
codegen-units = 1
panic = "abort"

[profile.release.build-override]
opt-level = 3
strip = true
codegen-units = 1

[profile.dev]
codegen-backend = "cranelift"
